[project]
name = "argus"
version = "0.1.0"
description = "Agentic Review of Gaps and Unrecognized Safety threats"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_data: needs the built MIMIC-IV store at ARGUS_STORE_DIR",
]
