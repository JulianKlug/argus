# Window rendering to prompt text (docs/spec_rendering.md). No clinical data, credentials or prompts.
# Budgets: docs/rendering_budget.md. Any change alters config_digest: a separate experimental condition.

format_version = 1

# Backend IDs from config/llm.toml whose tokenizers constrain rendering. Fixed set: one text per window.
tokenizers = ["qwen27", "mistral24", "medgemma27"]

# minimal: age, sex. full: adds race, language, insurance, marital status (separate condition).
demographics = "minimal"

[budget]                 # tokens, strictest configured tokenizer
total = 16000
current_state = 3000
trends = 2750
notes = 3000
past_admissions = 1500   # recent evidence: remainder

[selection]
recent_lookback_hours = 24
trend_lookback_hours = 24
trend_min_points = 3
past_dx_per_admission = 5

# Recent evidence selection order after in-window records first.
recent_domain_priority = [
    "medication_administrations",
    "inputs",
    "labs",
    "microbiology",
    "outputs",
    "procedures",
    "medication_orders",
    "orders",
    "charted_observations",
    "encounters",
    "outpatient_measurements",
]

# Shortened note: first present section of this list, then the others present, in this order, while they fit.
note_section_priority = [
    "IMPRESSION",
    "FINDINGS",
    "CONCLUSION",
    "DISCHARGE DIAGNOSIS",
    "BRIEF HOSPITAL COURSE",
    "DISCHARGE CONDITION",
    "DISCHARGE MEDICATIONS",
    "HISTORY OF PRESENT ILLNESS",
    "INDICATION",
]

# Records, core values and trend points show 'documented T-..' when known at least this long after their event
# time (e.g. lab result 3 h after draw), so a later result never reads as known at draw time. Measured on
# MIMIC-IV: median charting delay 20 min, lab result 70 min.
documented_delay_minutes = 30

# poe orders skipped from recent evidence when they have no poe_detail row: MIMIC-IV records no content for
# them (no frequency, activity level or diet), e.g. 'General Care: Activity, New'. Key: "order_type|order_subtype".
contentless_orders = [
    "General Care|Other",
    "General Care|Vitals/Monitoring",
    "General Care|Activity",
    "Nutrition|Diet Order",
]

# Core variables, in rendering order: (source table, itemid) -> display label.
